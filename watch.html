
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch Details - Timeless Watches</title>

    <link rel="stylesheet" href="css/khedma.css">
    <link rel="stylesheet" href="css/watch.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>


<header class="header-container">

    <h1>TIMELESS WATCHES</h1>

    <input type="search" placeholder="Search...">
    <i class="fa-solid fa-magnifying-glass"></i>

    <nav>
        <ul>
            <li><a href="khedma.html">Shop</a></li>
            <li><a href="new.html">New Arrivals</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <a href="cart.html" class="cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span>
    </a>

</header>


    <main class="product-details">

        <section class="product-gallery">
            <img id="main-image" src="" alt="Watch">

            <div class="thumbnails" id="thumbnails"></div>
        </section>

        <section class="product-info">

            <h2 id="product-name">Watch Name</h2>

            <p class="brand">TIMELESS WATCHES</p>

            <div class="price">
                <strong id="product-price"></strong>
                <span>MAD</span>
            </div>

            <p class="description">
                Discover elegance and style with our exclusive watch collection.
                A perfect choice for every occasion.
            </p>

            <div class="rating">
                ★★★★★
                <span>Rated 4.8/5</span>
            </div>

            <div class="quantity">
                <button id="minus">-</button>
                <input type="number" id="quantity" value="1" min="1">
                <button id="plus">+</button>
            </div>

            <button id="add-to-cart">Add to Bag</button>

            <div class="offer">
                <h3>Limited-Time Offer!</h3>
                <p>Discover our collection and enjoy elegant watches.</p>
            </div>

        </section>

    </main>

    <script src="js/watch.js"></script>
<script src="js/cart-counter.js"></script>
</body>
</html>
